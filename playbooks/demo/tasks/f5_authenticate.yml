# Description: Obtain a BIG-IP iControl REST authentication token via the
# shared authn/login endpoint, instead of authenticating every raw F5 REST
# call with HTTP Basic Auth (f5_username/f5_password sent on the request
# itself, as tasks/f5_discover_pool_from_ip.yml and lb_precheck_connectivity.yml
# used to do).
#
# Decision: on this environment, Basic Auth against /mgmt/tm/... does not
# authenticate f5_username/f5_password at all — confirmed against a working
# reference PowerShell token-refresh function that instead calls
# /mgmt/shared/authn/login with {username, password, loginProviderName} and
# reuses the returned token as an X-F5-Auth-Token header on every later call.
# This matches F5's own documented pattern for token-based iControl REST
# authentication (F5 KB K000148418: obtain a token once via a uri task, reuse
# it as a header on every subsequent uri task) and is the exact same login
# call f5networks.f5_modules performs internally for the module-based
# bigip_* tasks elsewhere in this demo when provider.auth_provider is set.
#
# What would invalidate this: a BIG-IP configuration change that re-enables
# Basic Auth for this account, or the account's actual auth partition being
# renamed away from f5_login_provider_name (default "tmos", matching the
# reference script — override per-environment if this F5 uses a different
# configured auth partition name).
#
# Requires: f5_server, f5_username, f5_password. Optional: f5_login_provider_name
# (defaults to "tmos"), f5_management_port (see f5_resolve_management_port.yml).
# Sets: f5_auth_token (raw token string), f5_auth_headers (ready-to-use
# headers dict for every ansible.builtin.uri task in this demo that talks to
# /mgmt/tm/... directly), and f5_resolved_management_port (see
# f5_resolve_management_port.yml).
---
- name: Resolve which port F5's iControl REST API is listening on before authenticating
  # Cached (see the file's own header) — a no-op on every include after the
  # first one in the same play.
  ansible.builtin.include_tasks: f5_resolve_management_port.yml
  tags:
    - f5
    - authenticate

- name: Authenticate to F5 BIG-IP and surface a credential-safe error on failure
  # block/rescue, not just register + ignore_errors: a bare fatal on the
  # no_log-protected uri task below censors the ENTIRE result — status code
  # and error message included — leaving no way to diagnose why login failed.
  # The rescue task re-raises with only status/msg (uri's own error text,
  # which never echoes the request body back), while the uri task itself
  # keeps no_log so its "invocation.module_args" — which does contain
  # f5_username/f5_password in the request body — never reaches the log.
  block:
    - name: Authenticate to F5 BIG-IP and obtain an iControl REST token
      ansible.builtin.uri:
        url: "https://{{ f5_server }}:{{ f5_resolved_management_port }}/mgmt/shared/authn/login"
        method: POST
        body_format: json
        body:
          username: "{{ f5_username }}"
          password: "{{ f5_password }}"
          loginProviderName: "{{ f5_login_provider_name | default('tmos') }}"
        validate_certs: false
        status_code: 200
      register: f5_auth_login
      # no_log is a task-level keyword, not a uri module parameter — it must
      # sit at this indentation (sibling of ansible.builtin.uri/register),
      # not inside the module's argument dict, or the uri module rejects it
      # as unsupported.
      no_log: "{{ demo_no_log | default(true) }}"
      tags:
        - f5
        - authenticate
  rescue:
    - name: Fail with a credential-safe diagnostic instead of the censored result
      ansible.builtin.fail:
        msg: >-
          F5 BIG-IP authentication to
          https://{{ f5_server }}:{{ f5_resolved_management_port }}/mgmt/shared/authn/login
          failed (HTTP {{ f5_auth_login.status | default('n/a') }}):
          {{ f5_auth_login.msg | default('no additional details returned') }}
      tags:
        - f5
        - authenticate
  tags:
    - f5
    - authenticate

- name: Build the reusable F5 token header set for subsequent REST calls
  ansible.builtin.set_fact:
    f5_auth_token: "{{ f5_auth_login.json.token.token }}"
    f5_auth_headers:
      X-F5-Auth-Token: "{{ f5_auth_login.json.token.token }}"
      Content-Type: application/json
  no_log: "{{ demo_no_log | default(true) }}"
  tags:
    - f5
    - authenticate
