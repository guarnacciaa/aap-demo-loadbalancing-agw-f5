# Description: Read-only credential and connectivity check for Azure
# Application Gateway and F5 BIG-IP. Confirms the injected Azure Service
# Principal (or Managed Identity) and F5 BIG-IP API credentials can
# authenticate and reach their respective backends, before any presence,
# status, drain, or reconnect task runs.
#
# The Azure side resolves the target VM (via target_vm_hostname/
# azure_resource_group) and its NIC, because this environment associates
# Application Gateway backend pool membership with the VM's NIC — there is
# no fixed agw_name to check independently of a VM anymore (see
# tasks/agw_discover_from_nic.yml). This never hard-fails when the VM
# currently has no live AGW association: that is a normal, expected state
# (for example right after a disconnect workflow run), not a connectivity
# problem. It only fails when the VM/NIC cannot be found, or when a live
# association points at an Application Gateway that is not reachable.
#
# The F5 side proves API reachability and authentication generically (list
# the pool collection) instead of checking one fixed pool: since
# f5_pool_name/f5_partition are no longer required variables (every LB - *
# scenario template discovers them from the target IP at runtime — see
# tasks/f5_discover_pool_from_ip.yml), there is no longer a single
# pre-configured pool to check independently of a VM.
---
- name: Check Azure Application Gateway and F5 BIG-IP credentials and connectivity
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - ansible.builtin

  pre_tasks:
    # target_vm_hostname is intentionally NOT declared as a self-referencing
    # play var (e.g. target_vm_hostname: "{{ target_vm_hostname | mandatory
    # }}"): that pattern only resolves correctly when the same-named var is
    # already supplied by a higher-precedence source (extra_vars); when it is
    # not supplied at all, Ansible fails with "recursive loop detected"
    # instead of a clear "mandatory" error. It is validated explicitly below
    # instead, alongside the other required connectivity check variables.
    - name: Validate required connectivity check variables
      ansible.builtin.assert:
        that:
          - target_vm_hostname is defined
          - azure_resource_group is defined
          - azure_resource_group != "CHANGE_ME"
          - f5_server is defined
          - f5_server != "CHANGE_ME"
        fail_msg: >-
          target_vm_hostname must be passed as an extra var (e.g. via the job
          template's Prompt on Launch survey). Set azure_resource_group and
          f5_server in demo_variables.yml and re-apply aap_config.yml before
          running connectivity checks.
      tags:
        - always

  tasks:
    - name: Resolve the target VM's NIC and any live Application Gateway backend pool association
      ansible.builtin.include_tasks: tasks/agw_discover_from_nic.yml
      tags:
        - azure
        - precheck

    - name: Confirm the resolved Application Gateway is reachable when the VM NIC has a live association
      azure.azcollection.azure_rm_appgateway_info:
        resource_group: "{{ agw_discovered_resource_group }}"
        name: "{{ agw_discovered_name }}"
        # AAP's Azure RM credential injects Service Principal env vars by
        # default; auth_source: msi switches to Managed Identity instead —
        # see credentials.yml and docs/setup.md.
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
      register: agw_connectivity_check
      when: agw_discovered_pool_ids_live | length > 0
      tags:
        - azure
        - precheck

    - name: Assert the Application Gateway was found, when a live NIC association exists
      ansible.builtin.assert:
        that:
          # azure_rm_appgateway_info registers its result list under "gateways",
          # not "applicationgateways" — verified against this module's actual
          # runtime output (see docs/testing.md for the confirming run).
          - agw_connectivity_check.gateways | length == 1
        fail_msg: >-
          Application Gateway {{ agw_discovered_name }} (resolved from VM
          {{ target_vm_hostname }}'s NIC) was not reachable in resource
          group {{ agw_discovered_resource_group }}. Check credentials (or
          the Managed Identity RBAC assignment when azure_auth_mode: msi).
      when: agw_discovered_pool_ids_live | length > 0
      tags:
        - azure
        - precheck

    - name: Report Azure reachability when the VM NIC has no live Application Gateway association
      ansible.builtin.debug:
        msg: >-
          VM {{ target_vm_hostname }} found in resource group
          {{ azure_resource_group }} — Azure Resource Manager is reachable.
          Its NIC currently has no Application Gateway backend pool
          association (expected if the VM is already disconnected).
      when: agw_discovered_pool_ids_live | length == 0
      tags:
        - azure
        - precheck

    # Token-based auth (see tasks/f5_authenticate.yml): Basic Auth against
    # /mgmt/tm/... does not authenticate f5_username on this environment, so
    # this check must mint a token the same way every other F5 call in this
    # demo does, or a connectivity check could pass/fail for the wrong reason.
    - name: Authenticate to F5 BIG-IP before the connectivity check
      ansible.builtin.include_tasks: tasks/f5_authenticate.yml
      tags:
        - f5
        - precheck

    # A lightweight GET on the pool collection proves both authentication
    # and API reachability without assuming any specific pool exists — see
    # the file header note on why this no longer checks one fixed pool.
    - name: Query F5 BIG-IP pool collection to confirm API reachability and authentication
      ansible.builtin.uri:
        url: "https://{{ f5_server }}:{{ f5_resolved_management_port }}/mgmt/tm/ltm/pool/"
        method: GET
        headers: "{{ f5_auth_headers }}"
        validate_certs: false
        status_code: 200
      register: f5_connectivity_check
      tags:
        - f5
        - precheck

    - name: Report F5 connectivity check result
      ansible.builtin.debug:
        msg: >-
          F5: authenticated and reached the LTM pool collection on
          {{ f5_server }}:{{ f5_resolved_management_port }}
          ({{ f5_connectivity_check.json['items'] | default([]) | length }} pool(s) visible to this credential).
      tags:
        - precheck
