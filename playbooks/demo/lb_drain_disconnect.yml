# Description: Drain connections and disconnect VM from AGW backend pool or F5 pool.
# AGW drain removes backend address; F5 uses forced_offline then disabled.
---
- name: Drain and disconnect VM from load balancer
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - f5networks.f5_modules
    - ansible.builtin

  vars:
    lb_backend_type: "{{ lb_backend_type | mandatory }}"
    target_vm_ip: "{{ target_vm_ip | mandatory }}"
    drain_wait_timeout: "{{ drain_wait_timeout | default(300) | int }}"
    drain_poll_interval: "{{ drain_poll_interval | default(15) | int }}"

  tasks:
    - name: Drain and remove VM from Application Gateway backend pool
      when: lb_backend_type == 'agw'
      block:
        - name: Read current Application Gateway configuration
          azure.azcollection.azure_rm_appgateway_info:
            resource_group: "{{ azure_resource_group }}"
            name: "{{ agw_name }}"
            # See lb_verify_presence.yml: auth_source switches to Managed
            # Identity when azure_auth_mode: msi.
            auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
          register: agw_info
          tags:
            - agw
            - drain

        - name: Compute updated AGW backend address pools
          ansible.builtin.set_fact:
            agw_updated_pools: >-
              {{
                agw_info.applicationgateways[0].backend_address_pools
                | json_query("[].{name: name, backend_addresses: backend_addresses}")
                | map('combine', {
                    'backend_addresses': (
                      backend_addresses | rejectattr('ip_address', 'equalto', target_vm_ip) | list
                    ) if name == agw_backend_pool_name else backend_addresses
                  })
                | list
              }}
          tags:
            - agw
            - drain

        - name: Apply Application Gateway backend pool update
          azure.azcollection.azure_rm_appgateway:
            resource_group: "{{ azure_resource_group }}"
            name: "{{ agw_name }}"
            location: "{{ agw_info.applicationgateways[0].location }}"
            sku: "{{ agw_info.applicationgateways[0].sku }}"
            gateway_ip_configurations: "{{ agw_info.applicationgateways[0].gateway_ip_configurations }}"
            frontend_ip_configurations: "{{ agw_info.applicationgateways[0].frontend_ip_configurations }}"
            frontend_ports: "{{ agw_info.applicationgateways[0].frontend_ports }}"
            backend_address_pools: "{{ agw_updated_pools }}"
            backend_http_settings_collection: "{{ agw_info.applicationgateways[0].backend_http_settings_collection }}"
            http_listeners: "{{ agw_info.applicationgateways[0].http_listeners }}"
            request_routing_rules: "{{ agw_info.applicationgateways[0].request_routing_rules }}"
            probes: "{{ agw_info.applicationgateways[0].probes | default(omit) }}"
            auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
          tags:
            - agw
            - drain

        - name: Wait for AGW connection drain window
          ansible.builtin.pause:
            seconds: "{{ drain_poll_interval }}"
          tags:
            - agw
            - drain

    - name: Drain and disable F5 pool member
      when: lb_backend_type == 'f5'
      block:
        - name: Force F5 pool member offline to drain existing connections
          f5networks.f5_modules.bigip_pool_member:
            pool: "{{ f5_pool_name }}"
            partition: "{{ f5_partition }}"
            address: "{{ target_vm_ip }}"
            port: "{{ f5_pool_member_port }}"
            state: forced_offline
            provider:
              server: "{{ f5_server }}"
              user: "{{ f5_username }}"
              password: "{{ f5_password }}"
              validate_certs: false
          tags:
            - f5
            - drain

        - name: Wait for F5 connection drain to complete
          ansible.builtin.pause:
            seconds: "{{ drain_wait_timeout }}"
          tags:
            - f5
            - drain

        - name: Disable F5 pool member after drain
          f5networks.f5_modules.bigip_pool_member:
            pool: "{{ f5_pool_name }}"
            partition: "{{ f5_partition }}"
            address: "{{ target_vm_ip }}"
            port: "{{ f5_pool_member_port }}"
            state: disabled
            provider:
              server: "{{ f5_server }}"
              user: "{{ f5_username }}"
              password: "{{ f5_password }}"
              validate_certs: false
          tags:
            - f5
            - drain

    - name: Record drain and disconnect outcome
      ansible.builtin.set_stats:
        data:
          lb_drain_disconnect: completed
          lb_backend_type: "{{ lb_backend_type }}"
          target_vm_ip: "{{ target_vm_ip }}"
      tags:
        - drain
