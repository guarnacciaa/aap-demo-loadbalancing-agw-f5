# Description: Drain connections and disconnect VM from AGW backend pool or F5 pool.
# AGW: detaches the target VM's NIC from whichever backend pool it is
# currently attached to (NIC-based membership — see
# tasks/agw_discover_from_nic.yml) and saves that pool's resource ID on the
# VM's tags so lb_reconnect.yml can restore the exact same association
# later, in a separate job run. F5 discovers every pool membership for the
# target IP (see tasks/f5_discover_pool_from_ip.yml) and applies
# forced_offline then disabled to each one — a node can be a member of
# several pools at once, and leaving any of them enabled would keep routing
# traffic to the VM. Every bigip_pool_member call also passes the
# discovered node_name (not just address): see the comment on the
# forced_offline task below for why this is required whenever the target
# pool names its members after the VM's hostname rather than its IP.
---
- name: Drain and disconnect VM from load balancer
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - f5networks.f5_modules
    - ansible.builtin

  vars:
    # target_vm_ip is an optional override: see tasks/resolve_vm_private_ip.yml
    # and the AGW/F5 branches below.
    #
    # lb_backend_type/target_vm_hostname (required) and drain_wait_timeout/
    # drain_poll_interval (optional) are intentionally NOT declared here as
    # "self-referencing" play vars (e.g. lb_backend_type: "{{ lb_backend_type
    # | mandatory }}", drain_poll_interval: "{{ drain_poll_interval |
    # default(15) }}"). That pattern only resolves correctly when the
    # same-named var is already supplied by a higher-precedence source
    # (extra_vars); when it is not supplied at all, Ansible fails with
    # "recursive loop detected" instead of a clear "mandatory" error or the
    # intended default. Required vars are validated explicitly in pre_tasks
    # below instead, and the optional timers' `| default(...)` filters are
    # applied directly at each point of use (the two pause tasks below).

  pre_tasks:
    - name: Require lb_backend_type and target_vm_hostname to be provided
      ansible.builtin.assert:
        that:
          - lb_backend_type is defined
          - target_vm_hostname is defined
        fail_msg: >-
          lb_backend_type and target_vm_hostname must be passed as extra vars
          (e.g. via the job template's Prompt on Launch survey).
      tags:
        - always

  tasks:
    # Shared AGW/F5 discovery — see tasks/resolve_lb_target.yml. Every
    # demo/lb_*.yml playbook includes this same file instead of repeating the
    # branch inline, so the discovery logic only exists in one place.
    - name: Resolve the target VM's current AGW/F5 backend state
      ansible.builtin.include_tasks: tasks/resolve_lb_target.yml
      tags:
        - agw
        - f5
        - drain

    - name: Drain and remove VM from Application Gateway backend pool
      when: lb_backend_type == 'agw'
      block:
        - name: Detach the target VM NIC and persist the removed association for a later reconnect
          ansible.builtin.include_tasks: tasks/agw_membership_update.yml
          vars:
            agw_membership_state: absent
          tags:
            - agw
            - drain

        - name: Wait for AGW connection drain window
          ansible.builtin.pause:
            seconds: "{{ drain_poll_interval | default(15) | int }}"
          when: agw_discovered_pool_ids_live | length > 0
          tags:
            - agw
            - drain

    - name: Drain and disable F5 pool member
      when: lb_backend_type == 'f5'
      block:
        - name: Fail fast when the target VM's IP is not currently a member of any F5 pool
          ansible.builtin.assert:
            that:
              - f5_discovered_pool_members | length > 0
            fail_msg: >-
              {{ target_vm_ip }} is not currently registered as a member of
              any F5 pool visible to the configured API credential. Nothing
              to drain/disconnect. Check target_vm_hostname/target_vm_ip,
              the F5 credential's partition access, or pass f5_pool_name
              explicitly to bypass discovery.
          tags:
            - f5
            - drain

        - name: Force every discovered F5 pool member offline to drain existing connections
          f5networks.f5_modules.bigip_pool_member:
            pool: "{{ item.pool }}"
            partition: "{{ item.partition }}"
            address: "{{ target_vm_ip }}"
            # Passing the real node name (see tasks/f5_discover_pool_from_ip.yml)
            # is required whenever the pool's member is named after the VM's
            # hostname rather than its IP: without it, bigip_pool_member
            # derives an IP-based name from `address` alone, fails to match
            # the existing hostname-named node, and attempts to CREATE a new
            # member instead of modifying the existing one — which many
            # restricted BIG-IP automation accounts correctly reject with
            # "does not have create access to object (pool_member)".
            name: "{{ item.node_name if (item.node_name | default('') | length > 0) else omit }}"
            port: "{{ item.port }}"
            state: forced_offline
            provider:
              server: "{{ f5_server }}"
              server_port: "{{ f5_resolved_management_port }}"
              user: "{{ f5_username }}"
              password: "{{ f5_password }}"
              validate_certs: false
              # Matches tasks/f5_authenticate.yml's loginProviderName: this
              # module's REST client mints its own token via the same
              # /mgmt/shared/authn/login endpoint, so it needs the same auth
              # partition name as every raw ansible.builtin.uri call in this demo.
              auth_provider: "{{ f5_login_provider_name | default('tmos') }}"
          loop: "{{ f5_discovered_pool_members }}"
          loop_control:
            label: "{{ item.partition }}/{{ item.pool }}:{{ item.port }}"
          tags:
            - f5
            - drain

        - name: Wait for F5 connection drain to complete
          ansible.builtin.pause:
            seconds: "{{ drain_wait_timeout | default(300) | int }}"
          tags:
            - f5
            - drain

        - name: Disable every discovered F5 pool member after drain
          f5networks.f5_modules.bigip_pool_member:
            pool: "{{ item.pool }}"
            partition: "{{ item.partition }}"
            address: "{{ target_vm_ip }}"
            # See the rationale comment on the forced_offline task above.
            name: "{{ item.node_name if (item.node_name | default('') | length > 0) else omit }}"
            port: "{{ item.port }}"
            state: disabled
            provider:
              server: "{{ f5_server }}"
              server_port: "{{ f5_resolved_management_port }}"
              user: "{{ f5_username }}"
              password: "{{ f5_password }}"
              validate_certs: false
              # Matches tasks/f5_authenticate.yml's loginProviderName: this
              # module's REST client mints its own token via the same
              # /mgmt/shared/authn/login endpoint, so it needs the same auth
              # partition name as every raw ansible.builtin.uri call in this demo.
              auth_provider: "{{ f5_login_provider_name | default('tmos') }}"
          loop: "{{ f5_discovered_pool_members }}"
          loop_control:
            label: "{{ item.partition }}/{{ item.pool }}:{{ item.port }}"
          tags:
            - f5
            - drain

    - name: Record drain and disconnect outcome
      ansible.builtin.set_stats:
        data:
          lb_drain_disconnect: completed
          lb_backend_type: "{{ lb_backend_type }}"
          target_vm_ip: "{{ target_vm_ip }}"
          f5_discovered_pool_members: "{{ f5_discovered_pool_members | default([]) }}"
      tags:
        - drain
