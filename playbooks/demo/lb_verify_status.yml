# Description: Verify connection/member status for AGW backend (via the
# target VM's NIC) or every discovered F5 pool member (see
# tasks/f5_discover_pool_from_ip.yml).
---
- name: Verify load balancer connection status for target VM
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - f5networks.f5_modules
    - ansible.builtin

  vars:
    lb_backend_type: "{{ lb_backend_type | mandatory }}"
    target_vm_hostname: "{{ target_vm_hostname | mandatory }}"
    # target_vm_ip is an optional override: see tasks/resolve_vm_private_ip.yml
    # and the AGW/F5 branches below.

  tasks:
    # Shared AGW/F5 discovery — see tasks/resolve_lb_target.yml. Every
    # demo/lb_*.yml playbook includes this same file instead of repeating the
    # branch inline, so the discovery logic only exists in one place.
    - name: Resolve the target VM's current AGW/F5 backend state
      ansible.builtin.include_tasks: tasks/resolve_lb_target.yml
      tags:
        - agw
        - f5
        - verify

    - name: Check AGW backend health via the target VM's NIC association
      when: lb_backend_type == 'agw'
      block:
        - name: Retrieve Application Gateway configuration for the discovered backend pool
          # Confirms the resolved Application Gateway is reachable. Only the
          # NIC-to-pool association itself is reported below: the
          # azure_rm_appgateway_info module does not surface per-backend
          # health probe results, and NIC-based pools carry no
          # backend_addresses entries to display (those are only populated
          # for IP-based membership).
          azure.azcollection.azure_rm_appgateway_info:
            resource_group: "{{ agw_discovered_resource_group }}"
            name: "{{ agw_discovered_name }}"
            auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
          register: agw_info
          when: agw_discovered_pool_ids_live | length > 0
          tags:
            - agw
            - verify

        - name: Report VM NIC to Application Gateway backend pool association
          vars:
            # Built as a Jinja if/else block instead of a nested inline
            # ternary in the debug msg, for readability.
            agw_status_message: >-
              {% if agw_discovered_pool_ids_live | length > 0 -%}
              VM {{ target_vm_hostname }} NIC {{ agw_discovered_nic_name }} is attached (via its IP configuration)
              to Application Gateway {{ agw_discovered_name }} / pool {{ agw_discovered_pool_name }}.
              {%- else -%}
              VM {{ target_vm_hostname }}'s NIC has no live Application Gateway backend pool association.
              {%- endif %}
          ansible.builtin.debug:
            msg: "{{ agw_status_message }}"
          tags:
            - agw
            - verify

    # check_mode + state: enabled never changes anything; "changed: true"
    # only means the member is not currently enabled (i.e. it is disabled or
    # forced_offline), which is how the loop below reports status per pool
    # without a second, state-specific read.
    - name: Check enabled state for every discovered F5 pool member
      when: lb_backend_type == 'f5'
      f5networks.f5_modules.bigip_pool_member:
        pool: "{{ item.pool }}"
        partition: "{{ item.partition }}"
        address: "{{ target_vm_ip }}"
        port: "{{ item.port }}"
        state: enabled
        provider:
          server: "{{ f5_server }}"
          user: "{{ f5_username }}"
          password: "{{ f5_password }}"
          validate_certs: false
      check_mode: true
      loop: "{{ f5_discovered_pool_members | default([]) }}"
      loop_control:
        label: "{{ item.partition }}/{{ item.pool }}:{{ item.port }}"
      register: f5_enabled_check
      tags:
        - f5
        - verify

    - name: Report F5 pool member status per discovered pool
      ansible.builtin.debug:
        msg: >-
          {{ target_vm_ip }} is
          {{ 'DISABLED/OFFLINE' if result.changed else 'ENABLED' }}
          in pool {{ result.item.partition }}/{{ result.item.pool }}:{{ result.item.port }}.
      loop: "{{ f5_enabled_check.results | default([]) }}"
      loop_control:
        loop_var: result
        label: "{{ result.item.partition }}/{{ result.item.pool }}:{{ result.item.port }}"
      when: lb_backend_type == 'f5'
      tags:
        - f5
        - verify

    - name: Report when the target VM's IP has no F5 pool membership at all
      ansible.builtin.debug:
        msg: "{{ target_vm_ip }} is not a member of any F5 pool visible to the configured API credential."
      when:
        - lb_backend_type == 'f5'
        - (f5_discovered_pool_members | default([])) | length == 0
      tags:
        - f5
        - verify

    - name: Record connection status verification
      ansible.builtin.set_stats:
        data:
          lb_verify_status: completed
          lb_backend_type: "{{ lb_backend_type }}"
          target_vm_ip: "{{ target_vm_ip }}"
          f5_discovered_pool_members: "{{ f5_discovered_pool_members | default([]) }}"
      tags:
        - verify
