# Description: Read-only preview of the AGW backend pool or F5 pool member
# state for the target VM selected in the workflow survey (lb_backend_type,
# target_vm_hostname — same variables LB - Verify/Drain/Reconnect consume;
# target_vm_ip is an optional override, auto-resolved from target_vm_hostname
# otherwise). Reports whether the target is currently present (relevant before
# drain/disconnect) or absent (relevant before reconnect), without asserting
# or making any change. Never creates, modifies, or deletes any Azure or F5
# object — safe to run repeatedly, including against a customer's
# pre-existing load balancer configuration. Run this (or launch
# LB - Pool status preview (dry run) in AAP) before either demo workflow to
# confirm what it will actually do. It also runs automatically as the second
# node of both workflows (after LB - Connectivity check), so a wrong
# hostname/IP fails fast — as an informational report, not a hard error —
# before any drain/disconnect/reconnect task runs.
#
# AGW: membership is NIC-based in this environment (see
# tasks/agw_discover_from_nic.yml), so "present" is resolved from the target
# VM's own NIC, not from a fixed agw_name/agw_backend_pool_name. When absent,
# this also reports whether a previously saved association exists (i.e.
# what LB - Reconnect VM to pool would restore).
#
# F5: pool, partition, AND member port are all discovered from the target
# IP (see tasks/f5_discover_pool_from_ip.yml) instead of read from fixed
# f5_pool_name/f5_partition/f5_pool_member_port variables — a node can be a
# member of several pools at once, and every one of them is reported.
---
- name: Preview load balancer pool state for the target VM
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - f5networks.f5_modules
    - ansible.builtin

  vars:
    # target_vm_ip is an optional override: when omitted, it is resolved
    # automatically from target_vm_hostname (AGW: reused from the NIC lookup
    # below at no extra cost; F5: tasks/resolve_vm_private_ip.yml). See
    # docs/setup.md#application-gateway-backend-discovery.
    #
    # lb_backend_type/target_vm_hostname are intentionally NOT declared here
    # as self-referencing play vars (e.g. lb_backend_type: "{{ lb_backend_type
    # | mandatory }}"): that pattern only resolves correctly when the
    # same-named var is already supplied by a higher-precedence source
    # (extra_vars); when it is not supplied at all, Ansible fails with
    # "recursive loop detected" instead of a clear "mandatory" error. They
    # are validated explicitly in pre_tasks below instead.

  pre_tasks:
    - name: Require lb_backend_type and target_vm_hostname to be provided
      ansible.builtin.assert:
        that:
          - lb_backend_type is defined
          - target_vm_hostname is defined
        fail_msg: >-
          lb_backend_type and target_vm_hostname must be passed as extra vars
          (e.g. via the job template's Prompt on Launch survey).
      tags:
        - always

  tasks:
    # Shared AGW/F5 discovery — see tasks/resolve_lb_target.yml. Every
    # demo/lb_*.yml playbook includes this same file instead of repeating the
    # branch inline, so the discovery logic only exists in one place.
    - name: Resolve the target VM's current AGW/F5 backend state
      ansible.builtin.include_tasks: tasks/resolve_lb_target.yml
      tags:
        - agw
        - f5
        - preview

    - name: Report AGW pool preview
      when: lb_backend_type == 'agw'
      vars:
        # Built as a set_fact with a Jinja if/elif/else block, rather than a
        # nested inline ternary in the debug msg itself, for readability —
        # three mutually exclusive report strings depending on live/saved
        # association state.
        agw_preview_message: >-
          {% if agw_discovered_pool_ids_live | length > 0 -%}
          VM {{ target_vm_hostname }} is currently PRESENT — its NIC is attached to Application Gateway
          {{ agw_discovered_name }} / pool {{ agw_discovered_pool_name }}. Drain/disconnect will remove it.
          {%- elif agw_discovered_pool_id_saved | length > 0 -%}
          VM {{ target_vm_hostname }} is currently ABSENT from any Application Gateway backend pool.
          Reconnect will restore its NIC to Application Gateway {{ agw_discovered_saved_name }}
          / pool {{ agw_discovered_saved_pool_name }} (from saved state).
          {%- else -%}
          VM {{ target_vm_hostname }} is currently ABSENT and no previously saved Application Gateway
          association was found on this VM. Run drain/disconnect first, or attach the NIC to the
          desired backend pool manually before relying on reconnect.
          {%- endif %}
      ansible.builtin.debug:
        msg: "{{ agw_preview_message }}"
      tags:
        - agw
        - preview

    - name: Preview F5 pool member state
      when: lb_backend_type == 'f5'
      block:
        # Pre-formatted here (rather than inline in the debug message below)
        # because Jinja2 has no list-comprehension syntax to build
        # "partition/pool:port" strings from a list of dicts in one expression.
        - name: Build the "partition/pool:port" summary list for the debug report below
          ansible.builtin.set_fact:
            f5_discovered_pool_summary: "{{ f5_discovered_pool_summary | default([]) + [item.partition + '/' + item.pool + ':' + (item.port | string)] }}"
          loop: "{{ f5_discovered_pool_members | default([]) }}"
          loop_control:
            label: "{{ item.partition }}/{{ item.pool }}:{{ item.port }}"
          tags:
            - f5
            - preview

        - name: Report F5 pool member preview
          vars:
            # Same rationale as the AGW report above: an if/else Jinja block
            # instead of a nested inline ternary.
            f5_preview_message: >-
              {% if f5_discovered_pool_members | length > 0 -%}
              VM {{ target_vm_hostname }} ({{ target_vm_ip }}) is currently PRESENT in
              {{ f5_discovered_pool_members | length }} F5 pool(s): {{ f5_discovered_pool_summary | default([]) | join(', ') }}
              — drain/disconnect will change all of them.
              {%- else -%}
              VM {{ target_vm_hostname }} ({{ target_vm_ip }}) is currently ABSENT from every F5
              pool visible to the configured API credential — reconnect will restore it only if it
              was a member before (bigip_pool_member disable does not remove the record; a
              never-provisioned VM has no membership to restore).
              {%- endif %}
          ansible.builtin.debug:
            msg: "{{ f5_preview_message }}"
          tags:
            - f5
            - preview

    - name: Publish preview summary for downstream workflow nodes
      ansible.builtin.set_stats:
        data:
          lb_preview_backend_type: "{{ lb_backend_type }}"
          lb_preview_target_vm_hostname: "{{ target_vm_hostname }}"
          lb_preview_target_vm_ip: "{{ target_vm_ip }}"
          f5_discovered_pool_members: "{{ f5_discovered_pool_members | default([]) }}"
      tags:
        - preview
