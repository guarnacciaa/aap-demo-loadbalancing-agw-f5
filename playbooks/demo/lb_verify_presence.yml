# Description: Verify target VM IP/FQDN is present in AGW backend pool or F5 pool.
# Set lb_backend_type to agw or f5 and pass target_vm_ip / target_vm_hostname.
---
- name: Verify VM presence in load balancer backend
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - f5networks.f5_modules
    - ansible.builtin

  vars:
    lb_backend_type: "{{ lb_backend_type | mandatory }}"
    target_vm_ip: "{{ target_vm_ip | mandatory }}"
    target_vm_hostname: "{{ target_vm_hostname | mandatory }}"

  tasks:
    - name: Verify VM is listed in Application Gateway backend pool
      when: lb_backend_type == 'agw'
      block:
        - name: Retrieve Application Gateway configuration
          azure.azcollection.azure_rm_appgateway_info:
            resource_group: "{{ azure_resource_group }}"
            name: "{{ agw_name }}"
            # AAP's Azure RM credential injects Service Principal env vars by
            # default; auth_source: msi switches to Managed Identity instead —
            # see credentials.yml and docs/setup.md.
            auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
          register: agw_info
          tags:
            - agw
            - verify

        - name: Find backend pool addresses for the configured pool name
          ansible.builtin.set_fact:
            agw_pool_addresses: >-
              {{
                (
                  agw_info.applicationgateways[0].backend_address_pools
                  | selectattr('name', 'equalto', agw_backend_pool_name)
                  | list | first
                ).backend_addresses | default([])
              }}
          tags:
            - agw
            - verify

        - name: Assert target VM IP exists in AGW backend pool
          ansible.builtin.assert:
            that:
              - agw_pool_addresses | selectattr('ip_address', 'equalto', target_vm_ip) | list | length > 0
            fail_msg: >-
              VM IP {{ target_vm_ip }} not found in AGW pool {{ agw_backend_pool_name }}.
          tags:
            - agw
            - verify

    - name: Verify VM is present as F5 pool member
      when: lb_backend_type == 'f5'
      block:
        # REST GET avoids assuming member state (enabled/disabled) during presence checks.
        - name: Query F5 pool member via iControl REST API
          ansible.builtin.uri:
            url: >-
              https://{{ f5_server }}/mgmt/tm/ltm/pool/~{{ f5_partition }}~{{ f5_pool_name }}/members/~{{ f5_partition }}~{{ target_vm_ip }}:{{ f5_pool_member_port }}
            method: GET
            user: "{{ f5_username }}"
            password: "{{ f5_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: 200
          register: f5_member_get
          tags:
            - f5
            - verify

        - name: Assert F5 pool member resource exists
          ansible.builtin.assert:
            that:
              - f5_member_get.json.address is defined
            fail_msg: >-
              F5 pool member {{ target_vm_ip }}:{{ f5_pool_member_port }} not found in {{ f5_pool_name }}.
          tags:
            - f5
            - verify

    - name: Record presence verification outcome
      ansible.builtin.set_stats:
        data:
          lb_verify_presence: passed
          lb_backend_type: "{{ lb_backend_type }}"
          target_vm_hostname: "{{ target_vm_hostname }}"
          target_vm_ip: "{{ target_vm_ip }}"
      tags:
        - verify
