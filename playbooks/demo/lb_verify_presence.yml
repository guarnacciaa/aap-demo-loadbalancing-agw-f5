# Description: Verify target VM is present in AGW backend pool (via its
# NIC's ipConfiguration) or in at least one F5 pool (discovered by IP across
# every pool/partition — see tasks/f5_discover_pool_from_ip.yml).
# Set lb_backend_type to agw or f5 and pass target_vm_hostname. target_vm_ip
# is an optional override — auto-resolved from target_vm_hostname otherwise.
---
- name: Verify VM presence in load balancer backend
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - f5networks.f5_modules
    - ansible.builtin

  vars:
    lb_backend_type: "{{ lb_backend_type | mandatory }}"
    target_vm_hostname: "{{ target_vm_hostname | mandatory }}"
    # target_vm_ip is an optional override: see tasks/resolve_vm_private_ip.yml
    # and the AGW/F5 blocks below.

  tasks:
    # Shared AGW/F5 discovery — see tasks/resolve_lb_target.yml. Every
    # demo/lb_*.yml playbook includes this same file instead of repeating the
    # branch inline, so the discovery logic only exists in one place.
    - name: Resolve the target VM's current AGW/F5 backend state
      ansible.builtin.include_tasks: tasks/resolve_lb_target.yml
      tags:
        - agw
        - f5
        - verify

    - name: Assert the target VM's NIC is attached to an Application Gateway backend pool
      when: lb_backend_type == 'agw'
      ansible.builtin.assert:
        that:
          - agw_discovered_pool_ids_live | length > 0
        fail_msg: >-
          VM {{ target_vm_hostname }}'s NIC has no Application Gateway
          backend pool association. Expected it to still be attached
          (this playbook does not check a specific pool name — membership
          is discovered from the NIC itself).
      tags:
        - agw
        - verify

    # Discovery itself doubles as the presence check: it already queries
    # every pool/partition visible to the credential and returns every
    # membership matching the target IP, so a non-empty result IS "present".
    - name: Assert the target VM's IP is a member of at least one F5 pool
      when: lb_backend_type == 'f5'
      ansible.builtin.assert:
        that:
          - f5_discovered_pool_members | length > 0
        fail_msg: >-
          F5 pool member {{ target_vm_ip }} not found in any pool
          visible to the configured API credential.
      tags:
        - f5
        - verify

    - name: Record presence verification outcome
      ansible.builtin.set_stats:
        data:
          lb_verify_presence: passed
          lb_backend_type: "{{ lb_backend_type }}"
          target_vm_hostname: "{{ target_vm_hostname }}"
          target_vm_ip: "{{ target_vm_ip }}"
          f5_discovered_pool_members: "{{ f5_discovered_pool_members | default([]) }}"
      tags:
        - verify
