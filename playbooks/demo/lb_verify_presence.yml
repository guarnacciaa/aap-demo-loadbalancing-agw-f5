# Description: Verify target VM is present in AGW backend pool (via its
# NIC's ipConfiguration) or F5 pool (by IP/port).
# Set lb_backend_type to agw or f5 and pass target_vm_hostname / target_vm_ip.
---
- name: Verify VM presence in load balancer backend
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - f5networks.f5_modules
    - ansible.builtin

  vars:
    lb_backend_type: "{{ lb_backend_type | mandatory }}"
    target_vm_ip: "{{ target_vm_ip | mandatory }}"
    target_vm_hostname: "{{ target_vm_hostname | mandatory }}"

  tasks:
    - name: Verify VM is attached to an Application Gateway backend pool via its NIC
      when: lb_backend_type == 'agw'
      block:
        - name: Resolve the target VM's NIC and any live Application Gateway backend pool association
          ansible.builtin.include_tasks: tasks/agw_discover_from_nic.yml
          tags:
            - agw
            - verify

        - name: Assert the target VM's NIC is attached to an Application Gateway backend pool
          ansible.builtin.assert:
            that:
              - agw_discovered_pool_ids_live | length > 0
            fail_msg: >-
              VM {{ target_vm_hostname }}'s NIC has no Application Gateway
              backend pool association. Expected it to still be attached
              (this playbook does not check a specific pool name — membership
              is discovered from the NIC itself).
          tags:
            - agw
            - verify

    - name: Verify VM is present as F5 pool member
      when: lb_backend_type == 'f5'
      block:
        # REST GET avoids assuming member state (enabled/disabled) during presence checks.
        - name: Query F5 pool member via iControl REST API
          ansible.builtin.uri:
            url: >-
              https://{{ f5_server }}/mgmt/tm/ltm/pool/~{{ f5_partition }}~{{ f5_pool_name }}/members/~{{ f5_partition }}~{{ target_vm_ip }}:{{ f5_pool_member_port }}
            method: GET
            user: "{{ f5_username }}"
            password: "{{ f5_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: 200
          register: f5_member_get
          tags:
            - f5
            - verify

        - name: Assert F5 pool member resource exists
          ansible.builtin.assert:
            that:
              - f5_member_get.json.address is defined
            fail_msg: >-
              F5 pool member {{ target_vm_ip }}:{{ f5_pool_member_port }} not found in {{ f5_pool_name }}.
          tags:
            - f5
            - verify

    - name: Record presence verification outcome
      ansible.builtin.set_stats:
        data:
          lb_verify_presence: passed
          lb_backend_type: "{{ lb_backend_type }}"
          target_vm_hostname: "{{ target_vm_hostname }}"
          target_vm_ip: "{{ target_vm_ip }}"
      tags:
        - verify
