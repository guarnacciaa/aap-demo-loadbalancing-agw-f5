# Description: Provision Azure infrastructure for the AGW/F5 load balancer demo.
# Idempotent; safe to re-run.
#
# Dual-mode operation controlled by azure_create_network_resources (default: false):
#   false — bring-your-own: validates that required IDs are supplied in demo_variables.yml.
#   true  — create-from-scratch: creates VNet, subnet, NSG, VMs, and configures the
#           AGW backend pool from scratch.
#
# Authenticates via the Service Principal credentials AAP injects (default) or,
# when azure_auth_mode: msi, via Managed Identity — see the auth_source
# parameter on each azure_rm_* task below and docs/setup.md. No task passes
# explicit subscription_id/client_id/secret/tenant, so the module always falls
# back to whatever the active auth mode provides.
#
# set_stats at the end publishes resolved VM IPs and resource names so downstream
# workflow nodes can use them without re-querying Azure.
#
# Corresponding teardown: 01_azure_teardown.yml
---
- name: Provision Azure infrastructure for load balancer demo
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - ansible.builtin

  vars_files:
    - ../../vault.yml
    - ../../group_vars/all/demo_variables.yml

  pre_tasks:
    # --- Validate bring-your-own mode ---
    # When azure_create_network_resources is false, all resource identifiers must
    # already be set.  Fail fast rather than letting tasks silently use wrong defaults.
    - name: Validate bring-your-own variables when not creating resources
      ansible.builtin.assert:
        that:
          - azure_resource_group is defined
          - azure_resource_group != "CHANGE_ME"
          - agw_vm_private_ip is defined
          - agw_vm_private_ip != "CHANGE_ME"
          - agw_name is defined
          - agw_name != "CHANGE_ME"
          - agw_backend_pool_name is defined
          - agw_backend_pool_name != "CHANGE_ME"
          - f5_vm_private_ip is defined
          - f5_vm_private_ip != "CHANGE_ME"
        fail_msg: >-
          azure_create_network_resources is false but one or more bring-your-own
          variables are still set to CHANGE_ME. Fill in azure_resource_group,
          agw_vm_private_ip, agw_name, agw_backend_pool_name, and f5_vm_private_ip
          in demo_variables.yml, or set azure_create_network_resources: true.
      when: not (azure_create_network_resources | default(false) | bool)
      tags:
        - always

  tasks:
    # =========================================================================
    # CREATE-FROM-SCRATCH PATH (azure_create_network_resources: true)
    # =========================================================================
    # These tasks are skipped when azure_create_network_resources is false.

    # --- Resource group ---
    - name: Create resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ azure_resource_group }}"
        location: "{{ azure_location | default('eastus') }}"
        # No explicit subscription_id/client_id/secret/tenant here: the module
        # falls back to the credentials AAP already injects for this job
        # (Service Principal env vars), or to auth_source: msi below when
        # azure_auth_mode: msi — see credentials.yml and docs/setup.md.
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        state: present
      when: azure_create_network_resources | default(false) | bool
      tags:
        - azure
        - network

    # --- Virtual network ---
    - name: Create virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        name: "{{ azure_vnet_name | default('demo-lb-vnet') }}"
        resource_group: "{{ azure_resource_group }}"
        address_prefixes_cidr:
          - "{{ azure_vnet_address_prefix | default('10.10.0.0/16') }}"
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        state: present
      when: azure_create_network_resources | default(false) | bool
      tags:
        - azure
        - network

    # --- Subnet ---
    - name: Create subnet
      azure.azcollection.azure_rm_subnet:
        name: "{{ azure_subnet_name | default('demo-lb-subnet') }}"
        resource_group: "{{ azure_resource_group }}"
        virtual_network_name: "{{ azure_vnet_name | default('demo-lb-vnet') }}"
        address_prefix_cidr: "{{ azure_subnet_address_prefix | default('10.10.1.0/24') }}"
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        state: present
      register: azure_subnet_result
      when: azure_create_network_resources | default(false) | bool
      tags:
        - azure
        - network

    # --- Network Security Group (allow SSH + HTTP for demo health checks) ---
    - name: Create network security group
      azure.azcollection.azure_rm_securitygroup:
        name: "{{ azure_nsg_name | default('demo-lb-nsg') }}"
        resource_group: "{{ azure_resource_group }}"
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        rules:
          - name: AllowSSH
            protocol: Tcp
            destination_port_range: 22
            access: Allow
            priority: 100
            direction: Inbound
          - name: AllowHTTP
            protocol: Tcp
            destination_port_range: 80
            access: Allow
            priority: 110
            direction: Inbound
        state: present
      when: azure_create_network_resources | default(false) | bool
      tags:
        - azure
        - network

    # --- VM for AGW backend (NIC) ---
    - name: Create NIC for AGW backend VM
      azure.azcollection.azure_rm_networkinterface:
        name: "nic-{{ agw_vm_hostname }}"
        resource_group: "{{ azure_resource_group }}"
        virtual_network_name: "{{ azure_vnet_name | default('demo-lb-vnet') }}"
        subnet_name: "{{ azure_subnet_name | default('demo-lb-subnet') }}"
        security_group: "{{ azure_nsg_name | default('demo-lb-nsg') }}"
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        state: present
      register: agw_vm_nic_result
      when: azure_create_network_resources | default(false) | bool
      tags:
        - azure
        - vms

    # --- VM for F5 pool member (NIC) ---
    - name: Create NIC for F5 pool member VM
      azure.azcollection.azure_rm_networkinterface:
        name: "nic-{{ f5_vm_hostname }}"
        resource_group: "{{ azure_resource_group }}"
        virtual_network_name: "{{ azure_vnet_name | default('demo-lb-vnet') }}"
        subnet_name: "{{ azure_subnet_name | default('demo-lb-subnet') }}"
        security_group: "{{ azure_nsg_name | default('demo-lb-nsg') }}"
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        state: present
      register: f5_vm_nic_result
      when: azure_create_network_resources | default(false) | bool
      tags:
        - azure
        - vms

    # --- AGW backend VM ---
    - name: Create AGW backend VM
      azure.azcollection.azure_rm_virtualmachine:
        name: "{{ agw_vm_hostname }}"
        resource_group: "{{ azure_resource_group }}"
        vm_size: "{{ azure_vm_size | default('Standard_B2s') }}"
        admin_username: "{{ azure_vm_admin_username | default('azureuser') }}"
        ssh_password_enabled: false
        ssh_public_keys:
          - path: "/home/{{ azure_vm_admin_username | default('azureuser') }}/.ssh/authorized_keys"
            key_data: "{{ azure_vm_ssh_public_key }}"
        network_interfaces:
          - "nic-{{ agw_vm_hostname }}"
        image:
          publisher: "{{ azure_vm_image_publisher | default('RedHat') }}"
          offer: "{{ azure_vm_image_offer | default('RHEL') }}"
          sku: "{{ azure_vm_image_sku | default('9-lvm-gen2') }}"
          version: latest
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        state: present
      register: agw_vm_result
      when: azure_create_network_resources | default(false) | bool
      tags:
        - azure
        - vms

    # --- F5 pool member VM ---
    - name: Create F5 pool member VM
      azure.azcollection.azure_rm_virtualmachine:
        name: "{{ f5_vm_hostname }}"
        resource_group: "{{ azure_resource_group }}"
        vm_size: "{{ azure_vm_size | default('Standard_B2s') }}"
        admin_username: "{{ azure_vm_admin_username | default('azureuser') }}"
        ssh_password_enabled: false
        ssh_public_keys:
          - path: "/home/{{ azure_vm_admin_username | default('azureuser') }}/.ssh/authorized_keys"
            key_data: "{{ azure_vm_ssh_public_key }}"
        network_interfaces:
          - "nic-{{ f5_vm_hostname }}"
        image:
          publisher: "{{ azure_vm_image_publisher | default('RedHat') }}"
          offer: "{{ azure_vm_image_offer | default('RHEL') }}"
          sku: "{{ azure_vm_image_sku | default('9-lvm-gen2') }}"
          version: latest
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        state: present
      register: f5_vm_result
      when: azure_create_network_resources | default(false) | bool
      tags:
        - azure
        - vms

    # =========================================================================
    # RESOLVE FACTS — unify both modes into a single set of variables
    # =========================================================================
    # After this block, agw_vm_ip_resolved and f5_vm_ip_resolved are used by
    # all downstream tasks regardless of which mode is active.
    - name: Resolve VM IPs from active provisioning mode
      ansible.builtin.set_fact:
        agw_vm_ip_resolved: >-
          {{ agw_vm_result.ansible_facts.azure_vm.properties.networkProfile
             .networkInterfaces[0].properties.ipConfigurations[0].properties.privateIPAddress
             if (azure_create_network_resources | default(false) | bool)
             else agw_vm_private_ip }}
        f5_vm_ip_resolved: >-
          {{ f5_vm_result.ansible_facts.azure_vm.properties.networkProfile
             .networkInterfaces[0].properties.ipConfigurations[0].properties.privateIPAddress
             if (azure_create_network_resources | default(false) | bool)
             else f5_vm_private_ip }}
      tags:
        - always

    # =========================================================================
    # AGW BACKEND POOL MEMBERSHIP (NIC-based association)
    # =========================================================================
    # Attach the AGW VM's NIC to the Application Gateway backend pool.
    # Runs in both modes — the pool membership is always (re)asserted
    # regardless of whether the VM was just created or already existed.
    #
    # Decision: the target environment associates AGW backend pool
    # membership with the VM's NIC ipConfiguration, not with a static
    # backend IP address — see playbooks/demo/tasks/agw_discover_from_nic.yml
    # for the matching runtime discovery used by the LB - * scenario
    # templates. azure_rm_appgateway only exposes backend_addresses
    # (IP-based) for write, so NIC-based membership must be managed on the
    # NIC resource via azure_rm_networkinterface instead. This playbook
    # never creates or modifies the Application Gateway resource itself —
    # it is always assumed to pre-exist (see docs/setup.md).
    - name: Look up the AGW backend VM to resolve its network interface
      azure.azcollection.azure_rm_virtualmachine_info:
        resource_group: "{{ azure_resource_group }}"
        name: "{{ agw_vm_hostname }}"
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
      register: agw_vm_lookup
      tags:
        - azure
        - agw

    - name: Retrieve current configuration of the AGW backend VM NIC
      azure.azcollection.azure_rm_networkinterface_info:
        resource_group: "{{ agw_vm_lookup.vms[0].resource_group }}"
        name: "{{ agw_vm_lookup.vms[0].network_interface_names[0] }}"
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
      register: agw_vm_nic_current
      tags:
        - azure
        - agw

    - name: Attach the AGW backend VM NIC to the Application Gateway backend pool
      # Re-sends the NIC's existing primary IP configuration values (subnet,
      # private IP, allocation method, primary flag) alongside the new
      # backend pool association: azure_rm_networkinterface is a
      # declarative "manage" module, and a partial update that omits them
      # can silently drop the existing configuration.
      azure.azcollection.azure_rm_networkinterface:
        name: "{{ agw_vm_nic_current.networkinterfaces[0].name }}"
        resource_group: "{{ agw_vm_nic_current.networkinterfaces[0].resource_group }}"
        virtual_network_name: "{{ agw_vm_nic_current.networkinterfaces[0].virtual_network.name }}"
        subnet_name: "{{ agw_vm_nic_current.networkinterfaces[0].subnet }}"
        ip_configurations:
          - name: "{{ agw_vm_nic_current.networkinterfaces[0].ip_configurations[0].name }}"
            primary: "{{ agw_vm_nic_current.networkinterfaces[0].ip_configurations[0].primary }}"
            private_ip_address: "{{ agw_vm_nic_current.networkinterfaces[0].ip_configurations[0].private_ip_address }}"
            private_ip_allocation_method: "{{ agw_vm_nic_current.networkinterfaces[0].ip_configurations[0].private_ip_allocation_method }}"
            application_gateway_backend_address_pools:
              - name: "{{ agw_backend_pool_name }}"
                application_gateway: "{{ agw_name }}"
        auth_source: "{{ 'msi' if (azure_auth_mode | default('service_principal') == 'msi') else omit }}"
        state: present
      tags:
        - azure
        - agw

  post_tasks:
    # Publish resolved IPs and resource names for downstream workflow nodes.
    # Operators should copy these values into demo_variables.yml for future runs
    # in bring-your-own mode.
    - name: Publish resolved infrastructure details
      ansible.builtin.set_stats:
        data:
          agw_vm_private_ip: "{{ agw_vm_ip_resolved }}"
          f5_vm_private_ip: "{{ f5_vm_ip_resolved }}"
          azure_resource_group: "{{ azure_resource_group }}"
          agw_name: "{{ agw_name }}"
          agw_backend_pool_name: "{{ agw_backend_pool_name }}"
      tags:
        - always

    - name: Azure infrastructure setup summary
      ansible.builtin.debug:
        msg: >-
          Azure setup complete.
          AGW VM IP: {{ agw_vm_ip_resolved }}
          F5 VM IP: {{ f5_vm_ip_resolved }}
          Resource group: {{ azure_resource_group }}
          Next step: run Setup - F5 pool member to register the F5 VM in the LTM pool.
      tags:
        - always
