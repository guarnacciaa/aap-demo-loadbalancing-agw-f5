# Description: Remove the demo VM from the F5 BIG-IP LTM pool.
# Requires explicit confirmation via -e demo_teardown_confirm=true.
#
# F5 BIG-IP is bring-your-own: this playbook only removes the pool member entry.
# It does not modify or delete the pool itself.
#
# f5_pool_member_port is an optional override, defaulting to 80 when left
# unset — must match whatever 02_f5_setup.yml actually registered the
# member on (BIG-IP identifies a member by address:port together).
#
# f5_vm_private_ip is an optional override; when not set it is resolved
# automatically from f5_vm_hostname via tasks/resolve_vm_private_ip.yml (same
# lookup as 02_f5_setup.yml, so this removes the exact same address it added).
#
# f5_node_name must match whatever 02_f5_setup.yml actually registered the
# member's node as (same rationale as f5_pool_member_port above) — set it
# here too if it was set at setup time, so this removes the exact same
# object instead of attempting to resolve a differently-named one.
#
# Run command:
#   ansible-playbook playbooks/setup/02_f5_teardown.yml \
#     -e demo_teardown_confirm=true --vault-id @prompt
---
- name: Remove demo VM from F5 BIG-IP LTM pool
  hosts: localhost
  gather_facts: false
  collections:
    - azure.azcollection
    - f5networks.f5_modules
    - ansible.builtin

  vars_files:
    - ../../vault.yml
    - ../../group_vars/all/demo_variables.yml

  pre_tasks:
    - name: Require demo_teardown_confirm=true before removing pool member
      ansible.builtin.assert:
        that:
          - demo_teardown_confirm | default(false) | bool
        fail_msg: >-
          Refusing to run teardown. Pass -e demo_teardown_confirm=true to
          remove the VM from the F5 pool.
      tags:
        - always

    - name: Resolve the F5 VM's private IP from Azure unless an explicit override was supplied
      ansible.builtin.include_tasks: ../demo/tasks/resolve_vm_private_ip.yml
      vars:
        target_vm_hostname: "{{ f5_vm_hostname }}"
      when: f5_vm_private_ip is not defined
      tags:
        - always

    - name: Use the auto-resolved private IP unless an explicit override was supplied
      ansible.builtin.set_fact:
        f5_vm_private_ip: "{{ f5_vm_private_ip | default(resolved_vm_private_ip) }}"
      when: f5_vm_private_ip is not defined
      tags:
        - always

    # This playbook talks to bigip_pool_member directly and never goes
    # through demo/tasks/resolve_lb_target.yml, so the port must be resolved
    # explicitly here — see demo/tasks/f5_resolve_management_port.yml.
    - name: Resolve which port F5's iControl REST API is listening on
      ansible.builtin.include_tasks: ../demo/tasks/f5_resolve_management_port.yml
      tags:
        - always

  tasks:
    - name: Remove VM from F5 LTM pool
      f5networks.f5_modules.bigip_pool_member:
        pool: "{{ f5_pool_name }}"
        partition: "{{ f5_partition }}"
        address: "{{ f5_vm_private_ip }}"
        name: "{{ f5_node_name | default(omit) }}"
        port: "{{ f5_pool_member_port | default(80) }}"
        state: absent
        provider:
          server: "{{ f5_server }}"
          server_port: "{{ f5_resolved_management_port }}"
          user: "{{ f5_username }}"
          password: "{{ f5_password }}"
          validate_certs: false
          # Matches demo/tasks/f5_authenticate.yml's loginProviderName: this
          # module's REST client mints its own token via the same
          # /mgmt/shared/authn/login endpoint, so it needs the same auth
          # partition name as every raw ansible.builtin.uri call in this demo.
          auth_provider: "{{ f5_login_provider_name | default('tmos') }}"
      ignore_errors: true
      tags:
        - f5

  post_tasks:
    - name: F5 pool member teardown summary
      ansible.builtin.debug:
        msg: >-
          F5 pool member removed.
          Pool: {{ f5_pool_name }} / {{ f5_partition }}
          Member removed: {{ f5_vm_private_ip }}:{{ f5_pool_member_port | default(80) }}
      tags:
        - always
