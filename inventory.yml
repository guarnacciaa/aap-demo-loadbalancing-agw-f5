---
all:
  hosts:
    localhost:
      ansible_connection: local

# F5 BIG-IP is automated via REST from localhost using provider credentials.
f5_bigip:
  hosts:
    f5-mgmt:
      ansible_host: "{{ f5_server }}"
      ansible_connection: ansible.netcommon.httpapi
      ansible_network_os: f5networks.f5_bigip.bigip
      ansible_httpapi_use_ssl: true
      ansible_httpapi_validate_certs: false
      ansible_user: "{{ f5_username }}"
      ansible_password: "{{ f5_password }}"
