---
# These Controller host records are informational only (browsing/labeling in
# the AAP UI) — no playbook in this demo connects to them over SSH; every
# Azure lookup targets localhost and calls the Azure API directly by VM
# hostname. agw_vm_private_ip/f5_vm_private_ip are optional overrides (see
# demo_variables.yml.example): when left unset, ansible_host falls back to
# the VM hostname string rather than failing this CasC apply on an undefined
# variable, since aap_config.yml itself never queries Azure to resolve them.
controller_hosts:
  - name: "{{ agw_vm_hostname }}"
    inventory: "{{ demo_azure_inventory_name }}"
    variables:
      cloud: azure
      lb_backend: agw
      ansible_host: "{{ agw_vm_private_ip | default(agw_vm_hostname) }}"

  - name: "{{ f5_vm_hostname }}"
    inventory: "{{ demo_azure_inventory_name }}"
    variables:
      cloud: azure
      lb_backend: f5
      ansible_host: "{{ f5_vm_private_ip | default(f5_vm_hostname) }}"
