---
# Infrastructure lifecycle job templates: only merged into controller_templates
# (see playbooks/aap_config.yml pre_tasks) when demo_manage_infrastructure is
# true. These create and destroy Azure networking/VMs from scratch (or bootstrap
# the F5 pool membership the demo scenario needs), so they must not exist in AAP
# for customer/PoC deployments that reuse existing infrastructure (see docs/setup.md).
#
# Kept under a separate var name (controller_templates_infra) so group_vars
# auto-loading this file does not unconditionally add these templates to the
# main controller_templates list; the merge is opt-in via the flag.
controller_templates_infra:
  - name: Setup - Azure infrastructure
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/setup/01_azure_setup.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    credentials:
      - "{{ azure_credential_name }}"
    extra_vars:
      # This playbook branches on azure_auth_mode (auth_source on every
      # azure_rm_* task); without threading it through extra_vars it never
      # reaches the playbook, since group_vars/all/ is not reliably
      # auto-loaded for playbooks/setup/*.yml under AAP's generated inventory.
      azure_auth_mode: "{{ azure_auth_mode }}"
    labels:
      - "{{ demo_label_name }}"

  - name: Setup - F5 pool member
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/setup/02_f5_setup.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    credentials:
      - "{{ f5_credential_name }}"
    labels:
      - "{{ demo_label_name }}"

  - name: Teardown - Azure infrastructure
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/setup/01_azure_teardown.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    credentials:
      - "{{ azure_credential_name }}"
    extra_vars:
      # See the comment on Setup - Azure infrastructure above: this playbook
      # also branches on azure_auth_mode and must receive it via extra_vars.
      azure_auth_mode: "{{ azure_auth_mode }}"
    labels:
      - "{{ demo_label_name }}"

  - name: Teardown - F5 pool member
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/setup/02_f5_teardown.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    credentials:
      - "{{ f5_credential_name }}"
    labels:
      - "{{ demo_label_name }}"
