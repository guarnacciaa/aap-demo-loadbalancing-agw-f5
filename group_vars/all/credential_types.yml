---
# Custom credential type for F5 BIG-IP REST API (injected as extra vars).
controller_credential_types:
  - name: F5 BIG-IP API
    kind: cloud
    inputs:
      fields:
        - id: f5_server
          type: string
          label: F5 management IP or hostname
        - id: f5_username
          type: string
          label: F5 API username
        - id: f5_password
          type: string
          label: F5 API password
          secret: true
    injectors:
      extra_vars:
        f5_server: "{% raw %}{{ f5_server }}{% endraw %}"
        f5_username: "{% raw %}{{ f5_username }}{% endraw %}"
        f5_password: "{% raw %}{{ f5_password }}{% endraw %}"
