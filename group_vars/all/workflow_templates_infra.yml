---
# Infrastructure lifecycle workflows: only merged into controller_workflows
# (see playbooks/aap_config.yml pre_tasks) when demo_manage_infrastructure is
# true. They provision or destroy Azure networking/VMs from scratch and
# bootstrap/remove the F5 pool membership, so they must not exist in AAP for
# customer/PoC deployments that reuse existing infrastructure (see docs/setup.md).
#
# Kept under a separate var name (controller_workflows_infra) so group_vars
# auto-loading this file does not unconditionally add these workflows to the
# main controller_workflows list; the merge is opt-in via the flag.
controller_workflows_infra:
  - name: WF - Demo setup
    description: >-
      Provision Azure infrastructure (VMs, networking, AGW backend pool) and
      register the F5 pool member. Run this before the demo scenario workflows.
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    ask_variables_on_launch: true
    labels:
      - "{{ demo_label_name }}"
    workflow_nodes:
      - identifier: azure_setup
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: Setup - Azure infrastructure
      - identifier: f5_setup
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: Setup - F5 pool member
        related:
          - identifier: azure_setup
            type: success

  - name: WF - Demo teardown
    description: >-
      Remove F5 pool membership and deprovision Azure VMs (and optionally
      networking). Run this after the demo to clean up cloud resources.
      Also run playbooks/aap_cleanup.yml to remove AAP objects.
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    ask_variables_on_launch: true
    labels:
      - "{{ demo_label_name }}"
    workflow_nodes:
      - identifier: f5_teardown
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: Teardown - F5 pool member
      - identifier: azure_teardown
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: Teardown - Azure infrastructure
        related:
          - identifier: f5_teardown
            type: success
