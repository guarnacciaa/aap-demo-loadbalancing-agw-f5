---
# Scenario workflows: always deployed regardless of demo_manage_infrastructure.
# They only verify, drain, disconnect, and reconnect a pre-existing VM's AGW/F5
# pool membership; they never touch Azure networking or the F5 pool itself.
controller_workflows:
  - name: WF - Disconnect VM from load balancer
    description: >-
      Connectivity check, pool preview, verify presence, verify status,
      drain/disconnect, collect results.
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    ask_variables_on_launch: true
    # survey_enabled must be set explicitly: survey_spec alone registers the
    # survey definition but leaves it disabled, so the launch UI shows only
    # the generic variables Prompt step with no survey questions.
    survey_enabled: true
    survey_spec: &lb_disconnect_survey
      name: LB disconnect survey
      description: Select load balancer backend type and target VM.
      spec:
        - variable: lb_backend_type
          question_name: Load balancer type (agw or f5)
          type: multiplechoice
          choices:
            - agw
            - f5
          required: true
        - variable: target_vm_hostname
          question_name: Target VM hostname
          type: text
          required: true
        - variable: target_vm_ip
          question_name: Target VM private IP (optional — auto-resolved from the hostname above when left blank)
          type: text
          required: false
    labels:
      - "{{ demo_label_name }}"
    # Use the simplified_workflow_nodes schema (ansible.controller.workflow_job_template_node
    # under the hood) instead of the bulk workflow_nodes schema: the latter requires an
    # explicit unified_job_template.type per node and a related.success_nodes/failure_nodes/
    # always_nodes *dict* (not the list-of-{identifier,type} shape it might look like from the
    # docs) — getting either wrong fails with "KeyError: 'type'" deep inside
    # ansible.controller.workflow_job_template. The simplified schema resolves
    # unified_job_template by plain name (scoped with lookup_organization to avoid ambiguous
    # matches) and links nodes with a flat list of identifiers in success_nodes.
    simplified_workflow_nodes:
      # Read-only credential/connectivity check: confirms AAP can
      # authenticate to Azure and F5 before any presence/status/drain task runs.
      - identifier: connectivity_check
        unified_job_template: LB - Connectivity check (dry run)
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - pool_preview
      # Read-only pre-flight check: reports whether the target is currently
      # present in the selected backend before any change is made.
      - identifier: pool_preview
        unified_job_template: LB - Pool status preview (dry run)
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - verify_presence
      - identifier: verify_presence
        unified_job_template: LB - Verify VM in pool
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - verify_status
      - identifier: verify_status
        unified_job_template: LB - Verify connection status
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - drain_disconnect
      - identifier: drain_disconnect
        unified_job_template: LB - Drain and disconnect VM
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - collect_results
      - identifier: collect_results
        unified_job_template: LB - Collect results
        lookup_organization: "{{ demo_organization_name }}"

  - name: WF - Reconnect VM to load balancer
    description: >-
      Connectivity check, pool preview, re-insert VM into pool, verify status,
      collect results.
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    ask_variables_on_launch: true
    # Same survey as WF - Disconnect VM from load balancer (see the anchor
    # above): docs/procedures.md tells operators to provide the same survey
    # values for reconnect, so reuse the identical spec instead of drifting.
    survey_enabled: true
    survey_spec: *lb_disconnect_survey
    labels:
      - "{{ demo_label_name }}"
    # See the comment on the simplified_workflow_nodes key in the workflow above for why this
    # schema (rather than the bulk workflow_nodes schema) is used.
    simplified_workflow_nodes:
      - identifier: connectivity_check
        unified_job_template: LB - Connectivity check (dry run)
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - pool_preview
      - identifier: pool_preview
        unified_job_template: LB - Pool status preview (dry run)
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - reconnect
      - identifier: reconnect
        unified_job_template: LB - Reconnect VM to pool
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - verify_status
      - identifier: verify_status
        unified_job_template: LB - Verify connection status
        lookup_organization: "{{ demo_organization_name }}"
        success_nodes:
          - collect_results
      - identifier: collect_results
        unified_job_template: LB - Collect results
        lookup_organization: "{{ demo_organization_name }}"
