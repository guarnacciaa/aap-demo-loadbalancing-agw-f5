---
# Scenario workflows: always deployed regardless of demo_manage_infrastructure.
# They only verify, drain, disconnect, and reconnect a pre-existing VM's AGW/F5
# pool membership; they never touch Azure networking or the F5 pool itself.
controller_workflows:
  - name: WF - Disconnect VM from load balancer
    description: >-
      Connectivity check, pool preview, verify presence, verify status,
      drain/disconnect, collect results.
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    ask_variables_on_launch: true
    survey_spec:
      name: LB disconnect survey
      description: Select load balancer backend type and target VM.
      spec:
        - variable: lb_backend_type
          question_name: Load balancer type (agw or f5)
          type: multiplechoice
          choices:
            - agw
            - f5
          required: true
        - variable: target_vm_hostname
          question_name: Target VM hostname
          type: text
          required: true
        - variable: target_vm_ip
          question_name: Target VM private IP (optional — auto-resolved from the hostname above when left blank)
          type: text
          required: false
    labels:
      - "{{ demo_label_name }}"
    workflow_nodes:
      # Read-only credential/connectivity check: confirms AAP can
      # authenticate to Azure and F5 before any presence/status/drain task runs.
      - identifier: connectivity_check
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Connectivity check (dry run)
      # Read-only pre-flight check: reports whether the target is currently
      # present in the selected backend before any change is made.
      - identifier: pool_preview
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Pool status preview (dry run)
        related:
          - identifier: connectivity_check
            type: success
      - identifier: verify_presence
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Verify VM in pool
        related:
          - identifier: pool_preview
            type: success
      - identifier: verify_status
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Verify connection status
        related:
          - identifier: verify_presence
            type: success
      - identifier: drain_disconnect
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Drain and disconnect VM
        related:
          - identifier: verify_status
            type: success
      - identifier: collect_results
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Collect results
        related:
          - identifier: drain_disconnect
            type: success

  - name: WF - Reconnect VM to load balancer
    description: >-
      Connectivity check, pool preview, re-insert VM into pool, verify status,
      collect results.
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    ask_variables_on_launch: true
    labels:
      - "{{ demo_label_name }}"
    workflow_nodes:
      - identifier: connectivity_check
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Connectivity check (dry run)
      - identifier: pool_preview
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Pool status preview (dry run)
        related:
          - identifier: connectivity_check
            type: success
      - identifier: reconnect
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Reconnect VM to pool
        related:
          - identifier: pool_preview
            type: success
      - identifier: verify_status
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Verify connection status
        related:
          - identifier: reconnect
            type: success
      - identifier: collect_results
        unified_job_template:
          organization:
            name: "{{ demo_organization_name }}"
          name: LB - Collect results
        related:
          - identifier: verify_status
            type: success
