---
# UC1: this artifact's own inventory hierarchy, following the same shape
# (parent + Azure-Resources/AWS-Resources children) as its sibling UC2/UC3
# PoC artifacts for a consistent multicloud UX. Each artifact uses its own
# Organization and Inventory names — see MULTICLOUD-POC-UC4.md and
# artifact--demo-variables.mdc for why these must never be shared.
controller_inventories:
  - name: "{{ demo_inventory_name }}"
    organization: "{{ demo_organization_name }}"
    description: Parent inventory for multicloud load balancer operations

  - name: Azure-Resources
    organization: "{{ demo_organization_name }}"
    description: Azure VMs and Application Gateway metadata
    inventory: "{{ demo_inventory_name }}"

  - name: AWS-Resources
    organization: "{{ demo_organization_name }}"
    description: Reserved for multicloud PoC consistency (unused in UC1)
    inventory: "{{ demo_inventory_name }}"
