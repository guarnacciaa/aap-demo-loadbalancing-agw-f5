---
# AAP 2.5+ credential input field names for the built-in Microsoft Azure
# Resource Manager credential type: subscription, client, secret, tenant
# (not subscription_id/client_id/client_secret as in older versions).
controller_credentials:
  # PAH container registry credential — allows Controller to pull the custom EE image.
  - name: "{{ hub_registry_credential_name }}"
    organization: "{{ demo_organization_name }}"
    credential_type: Container Registry
    inputs:
      host: "{{ hub_registry_host }}"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"
      verify_ssl: false
    no_log: "{{ demo_no_log | default(true) }}"

  # AAP's Azure RM credential type has no Managed Identity input (only Service
  # Principal or AD user/password — see docs/setup.md). When azure_auth_mode:
  # msi, the client/secret/tenant fields are omitted entirely from inputs so
  # no secret is stored in AAP at all; the playbooks pass auth_source: msi on
  # every azure_rm_* task instead (see setup/01_azure_setup.yml and friends).
  # The credential is still created so azure_subscription_id is available to
  # any task that reads it, and so job templates keep a stable credential
  # association regardless of auth mode.
  - name: "{{ azure_credential_name }}"
    organization: "{{ demo_organization_name }}"
    credential_type: Microsoft Azure Resource Manager
    inputs: >-
      {{
        {'subscription': azure_subscription_id,
         'client': azure_client_id,
         'secret': azure_client_secret,
         'tenant': azure_tenant_id}
        if (azure_auth_mode | default('service_principal') == 'service_principal')
        else {'subscription': azure_subscription_id}
      }}
    no_log: "{{ demo_no_log | default(true) }}"

  - name: "{{ f5_credential_name }}"
    organization: "{{ demo_organization_name }}"
    credential_type: F5 BIG-IP API
    inputs:
      f5_server: "{{ f5_server }}"
      f5_username: "{{ f5_username }}"
      f5_password: "{{ f5_password }}"
    no_log: "{{ demo_no_log | default(true) }}"
