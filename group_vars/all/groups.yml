---
controller_groups:
  - name: azure_vms
    inventory: Azure-Resources
    hosts:
      - "{{ agw_vm_hostname }}"
      - "{{ f5_vm_hostname }}"

  - name: azure_loadbalancers
    inventory: Azure-Resources
    variables:
      agw_name: "{{ agw_name }}"
      agw_resource_group: "{{ azure_resource_group }}"
      agw_backend_pool_name: "{{ agw_backend_pool_name }}"
      f5_pool_name: "{{ f5_pool_name }}"
      f5_partition: "{{ f5_partition }}"
