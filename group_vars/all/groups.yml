---
controller_groups:
  - name: azure_vms
    inventory: "{{ demo_azure_inventory_name }}"
    hosts:
      - "{{ agw_vm_hostname }}"
      - "{{ f5_vm_hostname }}"

  - name: azure_loadbalancers
    inventory: "{{ demo_azure_inventory_name }}"
    # Descriptive metadata only — not read by any LB - * scenario template,
    # which discovers the Application Gateway from the VM's NIC at runtime
    # instead (see docs/setup.md#application-gateway-backend-discovery).
    # agw_name/agw_backend_pool_name stay at their lab/dev example values in
    # customer/PoC mode; that is expected and harmless here.
    variables:
      agw_name: "{{ agw_name }}"
      agw_resource_group: "{{ azure_resource_group }}"
      agw_backend_pool_name: "{{ agw_backend_pool_name }}"
      f5_pool_name: "{{ f5_pool_name }}"
      f5_partition: "{{ f5_partition }}"
