---
# Scenario job templates: always deployed regardless of demo_manage_infrastructure.
# They only operate against a pre-existing VM's AGW/F5 pool membership; they
# never create or destroy Azure networking, VMs, or the F5 pool itself, so
# they are safe in both lab/dev (self-provisioned) and customer/PoC
# (bring-your-own) deployments.
# Dispatch role reads controller_templates (not controller_job_templates).
#
# IMPORTANT — lb_backend_type/target_vm_hostname below are STANDALONE-LAUNCH
# DEFAULTS, not fixed behavior. Every LB - * template also carries its own
# survey_spec (below) covering the same identity variables as the workflow
# survey, so a standalone launch from the AAP UI prompts for them with the
# fixed extra_vars pre-filled as the survey question default — leaving a
# question blank at launch keeps the corresponding extra_vars value here.
# When a template runs as a node inside WF - Disconnect/Reconnect VM from
# load balancer, AAP does not re-prompt this per-template survey: the
# workflow's OWN survey answers (see group_vars/all/workflow_templates.yml)
# are passed as prompted extra_vars, which take precedence over both the
# defaults below and this file's survey_spec. See docs/procedures.md for
# worked CLI examples of overriding these at launch.
#
# azure_auth_mode is threaded through extra_vars on every Azure-facing
# template below for a different, unrelated reason: playbooks/demo/*.yml run
# against AAP's generated inventory, which does not reliably auto-load
# group_vars/all/demo_variables.yml. Without azure_auth_mode in extra_vars,
# the auth_source Jinja on every azure_rm_* task would silently fall back to
# the service_principal branch even when azure_auth_mode: msi is configured.
controller_templates:
  - name: LB - Connectivity check (dry run)
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/demo/lb_precheck_connectivity.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    extra_vars:
      azure_resource_group: "{{ azure_resource_group }}"
      # The Application Gateway is discovered from this VM's NIC (see
      # playbooks/demo/tasks/agw_discover_from_nic.yml) — there is no fixed
      # agw_name to pass here.
      target_vm_hostname: "{{ agw_vm_hostname }}"
      azure_auth_mode: "{{ azure_auth_mode }}"
      # No f5_pool_name/f5_partition to pass here: the F5 branch below
      # proves API reachability generically instead of checking one fixed
      # pool — see the file header note in lb_precheck_connectivity.yml.
    credentials:
      - "{{ azure_credential_name }}"
      - "{{ f5_credential_name }}"
    labels:
      - "{{ demo_label_name }}"
    # No lb_backend_type/target_vm_ip question: this playbook always checks
    # both Azure (via the VM's NIC) and F5 in one run — see
    # lb_precheck_connectivity.yml.
    survey_enabled: true
    survey_spec:
      name: LB connectivity check survey
      description: Optionally override the VM used for the Azure-side reachability check.
      spec:
        - variable: target_vm_hostname
          question_name: Target VM hostname
          question_description: Leave blank to use the configured AGW VM ({{ agw_vm_hostname }}).
          type: text
          default: "{{ agw_vm_hostname }}"
          required: false

  - name: LB - Pool status preview (dry run)
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/demo/lb_pool_preview.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    extra_vars:
      lb_backend_type: agw
      # target_vm_ip is not passed here: playbooks/demo/lb_pool_preview.yml
      # resolves it automatically from target_vm_hostname's NIC (see
      # tasks/agw_discover_from_nic.yml / tasks/resolve_vm_private_ip.yml).
      target_vm_hostname: "{{ agw_vm_hostname }}"
      azure_resource_group: "{{ azure_resource_group }}"
      azure_auth_mode: "{{ azure_auth_mode }}"
      # No f5_pool_name/f5_partition/f5_pool_member_port to pass here: the F5
      # branch discovers pool, partition, and port from the target IP at
      # runtime — see playbooks/demo/tasks/f5_discover_pool_from_ip.yml.
    credentials:
      - "{{ azure_credential_name }}"
      - "{{ f5_credential_name }}"
    labels:
      - "{{ demo_label_name }}"
    survey_enabled: true
    # Anchored so every other LB - * template below that shares the same
    # lb_backend_type/target_vm_hostname/target_vm_ip identity variables
    # reuses this exact spec instead of repeating it — mirrors the survey
    # already used by both WF - Disconnect/Reconnect workflows (see
    # group_vars/all/workflow_templates.yml), scoped to a single template.
    # required: false on every question: leaving one blank at launch keeps
    # this template's own extra_vars default above (documented in the file
    # header) instead of failing the launch.
    survey_spec: &lb_target_survey
      name: LB target survey
      description: Select the load balancer backend type and target VM for this standalone run.
      spec:
        - variable: lb_backend_type
          question_name: Load balancer type (agw or f5)
          question_description: Leave blank to use this template's default (agw).
          type: multiplechoice
          choices:
            - agw
            - f5
          default: agw
          required: false
        - variable: target_vm_hostname
          question_name: Target VM hostname
          question_description: Leave blank to use the configured AGW VM ({{ agw_vm_hostname }}).
          type: text
          default: "{{ agw_vm_hostname }}"
          required: false
        - variable: target_vm_ip
          question_name: Target VM private IP (optional — auto-resolved from the hostname above when left blank)
          type: text
          required: false

  - name: LB - Verify VM in pool
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/demo/lb_verify_presence.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    extra_vars:
      lb_backend_type: agw
      target_vm_hostname: "{{ agw_vm_hostname }}"
      azure_resource_group: "{{ azure_resource_group }}"
      azure_auth_mode: "{{ azure_auth_mode }}"
      # The F5 branch (lb_backend_type: f5) discovers pool/partition/port
      # from the target IP at runtime — see
      # playbooks/demo/tasks/f5_discover_pool_from_ip.yml — no fixed
      # f5_pool_name/f5_partition/f5_pool_member_port to pass here.
    credentials:
      - "{{ azure_credential_name }}"
      - "{{ f5_credential_name }}"
    labels:
      - "{{ demo_label_name }}"
    survey_enabled: true
    survey_spec: *lb_target_survey

  - name: LB - Verify connection status
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/demo/lb_verify_status.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    extra_vars:
      lb_backend_type: agw
      target_vm_hostname: "{{ agw_vm_hostname }}"
      azure_resource_group: "{{ azure_resource_group }}"
      azure_auth_mode: "{{ azure_auth_mode }}"
      # See the comment on LB - Verify VM in pool above: the F5 branch
      # discovers pool/partition/port from the target IP at runtime.
    credentials:
      - "{{ azure_credential_name }}"
      - "{{ f5_credential_name }}"
    labels:
      - "{{ demo_label_name }}"
    survey_enabled: true
    survey_spec: *lb_target_survey

  - name: LB - Drain and disconnect VM
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/demo/lb_drain_disconnect.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    extra_vars:
      lb_backend_type: agw
      target_vm_hostname: "{{ agw_vm_hostname }}"
      azure_resource_group: "{{ azure_resource_group }}"
      drain_wait_timeout: "{{ drain_wait_timeout }}"
      azure_auth_mode: "{{ azure_auth_mode }}"
      # See the comment on LB - Verify VM in pool above: the F5 branch
      # discovers pool/partition/port from the target IP at runtime.
    credentials:
      - "{{ azure_credential_name }}"
      - "{{ f5_credential_name }}"
    labels:
      - "{{ demo_label_name }}"
    survey_enabled: true
    survey_spec: *lb_target_survey

  - name: LB - Reconnect VM to pool
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/demo/lb_reconnect.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    ask_variables_on_launch: true
    extra_vars:
      lb_backend_type: agw
      target_vm_hostname: "{{ agw_vm_hostname }}"
      azure_resource_group: "{{ azure_resource_group }}"
      azure_auth_mode: "{{ azure_auth_mode }}"
      # See the comment on LB - Verify VM in pool above: the F5 branch
      # discovers pool/partition/port from the target IP at runtime.
    credentials:
      - "{{ azure_credential_name }}"
      - "{{ f5_credential_name }}"
    labels:
      - "{{ demo_label_name }}"
    survey_enabled: true
    survey_spec: *lb_target_survey

  - name: LB - Collect results
    organization: "{{ demo_organization_name }}"
    inventory: "{{ demo_inventory_name }}"
    project: "{{ demo_project_name }}"
    playbook: playbooks/demo/lb_collect_results.yml
    execution_environment: "{{ demo_execution_environment_name }}"
    labels:
      - "{{ demo_label_name }}"
